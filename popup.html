<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LATIAS</title>
  <style>
    body { font-family: system-ui, sans-serif; width: auto; min-width: 300px; margin: 0; padding: 14px; background:#fafafa; color:#222; }
    h1 { font-size: 18px; margin: 0 0 10px; }
    .member { font-size: 12px; margin-bottom: 12px; padding: 8px; background:#fff; border:1px solid #ddd; border-radius:8px; }
    .grid { display:grid; gap:8px; }
    button { min-height: 44px; border: 0; border-radius: 8px; cursor:pointer; font-weight: 700; font-size:14px; }
    button.primary { background:#222; color:#fff; }
    button.secondary { background:#e9e9e9; color:#222; }
    button.danger { background:#fff0f0; color:#8a1111; border:1px solid #e4bcbc; }
    #status { margin-top:10px; font-size:12px; white-space:pre-wrap; line-height:1.45; }
    .links { margin-top:10px; display:flex; gap:10px; font-size:12px; }
    a { color:#333; }
  </style>
</head>
<body>
  <h1>LATIAS <span style="font-size:11px;font-weight:500;color:#777">v0.9.8.1</span></h1>
  <div id="member" class="member">メンバー未設定</div>
  <div id="ruleStatus" style="font-size:11px;color:#666;margin:-4px 0 10px">本体 0.9.8.1 / 共通ルール: 確認中…</div>
  <div class="grid">
    <button id="openUrls" class="primary">① URL一斉読み込み</button>
    <button id="reloadTabs" class="secondary">② 一斉リロード</button>
    <button id="fillForms" class="primary">③ 必要事項を埋める</button>
    <button id="agreeTerms" class="secondary">④ 同意を押す</button>
    <button id="inspectForm" class="danger">🔎 このページのフォーム構造を取得</button>
  </div>
  <div id="status"></div>
  <div class="links"><a href="options.html" target="_blank">メンバー設定</a></div>
  <script src="popup.js"></script>
</body>
</html>
